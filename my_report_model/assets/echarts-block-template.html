<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="auto">
<meta name="description" content="图表结论摘要，替换为实际内容">
<title>图表标题</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
body{margin:0;padding:16px;font-family:"Microsoft YaHei","微软雅黑",sans-serif;background:#fff}
.chart-title{font-size:16px;font-weight:bold;color:#1A2B4A;margin-bottom:4px}
.chart-sub{font-size:12px;color:#758092;margin-bottom:8px}
#chart{width:100%;height:340px}
.chart-note{font-size:11px;color:#999;margin-top:6px}
</style>
</head>
<body>
<div class="chart-title">图表标题（替换）</div>
<div class="chart-sub">副标题/数据口径说明（替换）</div>
<div id="chart"></div>
<div class="chart-note">数据来源：XXX，发布时间，访问时间</div>
<script>
var navy='#1A2B4A',navyLight='#3d5a80',gray='#BABFC9',red='#c0392b';
var chart=echarts.init(document.getElementById('chart'));
// 替换为实际图表配置
var option={
  tooltip:{trigger:'axis'},
  grid:{left:'3%',right:'5%',bottom:'8%',top:'10%',containLabel:true},
  xAxis:{type:'category',data:['A','B','C','D']},
  yAxis:{type:'value'},
  series:[{type:'bar',data:[10,20,30,40],itemStyle:{color:navy},label:{show:true,position:'top'}}]
};
chart.setOption(option);
window.addEventListener('resize',function(){chart.resize()});
</script>
</body>
</html>
